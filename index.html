<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDaily - 技术人每日资讯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #1c2128;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --primary: #58a6ff;
            --primary-hover: #79b8ff;
            --tag-ai: #ff7b72;
            --tag-frontend: #7ee787;
            --tag-backend: #79c0ff;
            --tag-mobile: #d2a8ff;
            --tag-cloud: #ffa657;
            --tag-security: #f778ba;
            --tag-opensource: #a5d6ff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary), var(--tag-cloud));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        
        .today-date {
            display: inline-block;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 8px;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        input[type="date"] {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        
        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            color: #fff;
        }
        
        .btn.fav {
            color: var(--tag-ai);
            border-color: rgba(255, 123, 114, 0.3);
        }
        
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        
        .nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .nav button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .nav button:hover {
            color: var(--text);
        }
        
        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .article-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            background: var(--surface-hover);
        }
        
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(88, 166, 255, 0.15);
            color: var(--primary);
        }
        
        .tag.ai { background: rgba(255, 123, 114, 0.15); color: var(--tag-ai); }
        .tag.frontend { background: rgba(126, 231, 135, 0.15); color: var(--tag-frontend); }
        .tag.backend { background: rgba(121, 192, 255, 0.15); color: var(--tag-backend); }
        .tag.mobile { background: rgba(210, 168, 255, 0.15); color: var(--tag-mobile); }
        .tag.cloud { background: rgba(255, 166, 87, 0.15); color: var(--tag-cloud); }
        .tag.security { background: rgba(247, 120, 186, 0.15); color: var(--tag-security); }
        .tag.opensource { background: rgba(165, 214, 255, 0.15); color: var(--tag-opensource); }
        
        .article-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
            line-height: 1.4;
        }
        
        .article-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 28px 28px 0;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: var(--border);
            color: var(--text);
        }
        
        .modal-body {
            padding: 24px 28px 28px;
        }
        
        .modal-meta-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-right: 40px;
            line-height: 1.4;
            color: var(--text);
        }
        
        .modal-content-box {
            background: var(--bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border-left: 4px solid var(--primary);
        }
        
        .modal-content-box h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .modal-summary-full {
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text);
        }
        
        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .modal-info-item {
            background: var(--bg);
            padding: 14px 18px;
            border-radius: 10px;
        }
        
        .modal-info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .modal-info-value {
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 500;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .modal-actions .btn {
            padding: 10px 20px;
            font-size: 15px;
        }
        
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 1.5rem; }
            .article-card { padding: 18px; }
            .nav button { padding: 10px 14px; font-size: 14px; }
            .modal-title { font-size: 1.2rem; }
            .modal-body { padding: 16px 20px 20px; }
            .modal-header { padding: 20px 20px 0; }
            .modal-info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TechDaily</h1>
            <p class="subtitle">技术人每日必读资讯 · 每小时自动更新</p>
            <div class="today-date" id="todayDate">加载中...</div>
        </header>
        
        <div class="controls" id="controlsArea">
            <input type="date" id="datePicker">
            <button class="btn" onclick="setToday()">回到今日</button>
            <button class="btn btn-primary" onclick="refreshNews()">🔄 换一批</button>
        </div>
        
        <!-- 分类页签（动态生成） -->
        <nav class="nav" id="categoryNav">
            <!-- 由 JS 动态插入分类按钮 -->
        </nav>
        
        <div id="content"></div>
    </div>

    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <div class="modal-meta-row">
                    <span class="tag" id="modalTag">分类</span>
                    <span style="color: var(--text-secondary); font-size: 0.9rem;" id="modalDate">📅 日期</span>
                </div>
                <div class="modal-title" id="modalTitle">标题</div>
            </div>
            <div class="modal-body">
                <div class="modal-info-grid">
                    <div class="modal-info-item">
                        <div class="modal-info-label">来源</div>
                        <div class="modal-info-value" id="modalSource">--</div>
                    </div>
                    <div class="modal-info-item">
                        <div class="modal-info-label">分类</div>
                        <div class="modal-info-value" id="modalCategory">--</div>
                    </div>
                </div>
                
                <div class="modal-content-box">
                    <h3>📄 内容摘要</h3>
                    <div class="modal-summary-full" id="modalSummary">摘要内容</div>
                </div>
                
                <div class="modal-actions">
                    <button class="btn btn-primary" id="modalFavBtn" onclick="toggleFavFromModal()">☆ 收藏</button>
                    <button class="btn" onclick="copyLink()">📋 复制链接</button>
                    <button class="btn" onclick="openSource()">↗ 阅读原文</button>
                    <button class="btn" onclick="closeModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== 工具函数：获取北京时间 ====================
        function getBeijingDate() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 8));
        }
        
        function getTodayStr() {
            const d = getBeijingDate();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        function getTodayDisplay() {
            const d = getBeijingDate();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const month = d.getMonth() + 1;
            const day = d.getDate();
            const week = weekdays[d.getDay()];
            return `今天 ${month}月${day}日 星期${week}`;
        }

        // ==================== 数据加载 ====================
        let articles = [];
        let currentCategory = 'ai';      // 当前选中的分类
        let currentDate = getTodayStr(); // 当前选中的日期
        let displayedArticles = [];
        let currentModalId = null;
        let categories = [];             // 动态分类列表

        async function loadArticles() {
            try {
                const response = await fetch('data/news.json?t=' + Date.now());
                const data = await response.json();
                articles = data;
                // 提取所有不重复的分类
                extractCategories();
                // 渲染分类导航
                renderCategoryNav();
                // 初始化显示
                initDisplay();
            } catch (err) {
                console.error('加载数据失败:', err);
                document.getElementById('content').innerHTML = 
                    '<div class="empty">数据加载失败，请稍后刷新重试<br><small style="color:var(--text-secondary)">每小时自动更新中...</small></div>';
            }
        }

        // ==================== 提取分类 ====================
        function extractCategories() {
            const catMap = new Map();
            articles.forEach(a => {
                if (a.category && !catMap.has(a.category)) {
                    catMap.set(a.category, {
                        key: a.category,
                        name: a.categoryName || a.category
                    });
                }
            });
            // 按固定顺序排序，未定义的放后面
            const order = ['ai', 'frontend', 'backend', 'mobile', 'cloud', 'security', 'opensource'];
            categories = [];
            order.forEach(key => {
                if (catMap.has(key)) {
                    categories.push(catMap.get(key));
                    catMap.delete(key);
                }
            });
            // 剩余分类
            catMap.forEach(cat => categories.push(cat));
        }

        // ==================== 渲染分类导航 ====================
        function renderCategoryNav() {
            const nav = document.getElementById('categoryNav');
            let html = '';
            
            // 生成分类按钮
            categories.forEach(cat => {
                const isActive = cat.key === currentCategory ? 'active' : '';
                html += `<button class="${isActive}" onclick="switchCategory('${cat.key}', this)">${cat.name}</button>`;
            });
            
            // 收藏按钮（固定在最后）
            const favActive = currentCategory === 'favorites' ? 'active' : '';
            html += `<button class="${favActive}" onclick="showFavorites(this)">我的收藏</button>`;
            
            nav.innerHTML = html;
        }

        // ==================== 日期格式化 ====================
        function formatDate(dateStr) {
            if (!dateStr || dateStr === 'undefined' || dateStr === 'null') return '日期未知';
            const today = getTodayStr();
            const yesterday = new Date(getBeijingDate().getTime() - 86400000);
            const yestStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
            
            if (dateStr === today) return '今天';
            if (dateStr === yestStr) return '昨天';
            return dateStr;
        }

        // ==================== 收藏功能 ====================
        function getFavorites() {
            return JSON.parse(localStorage.getItem('techdaily_favs') || '[]');
        }

        function toggleFav(id, event) {
            if (event) event.stopPropagation();
            let favs = getFavorites();
            if (favs.includes(id)) {
                favs = favs.filter(f => f !== id);
                showToast('已取消收藏');
            } else {
                favs.push(id);
                showToast('已收藏');
            }
            localStorage.setItem('techdaily_favs', JSON.stringify(favs));
            render();
            if (currentModalId === id) {
                updateModalFavBtn(id);
            }
        }

        function toggleFavFromModal() {
            if (currentModalId !== null) {
                toggleFav(currentModalId);
            }
        }

        function isFav(id) {
            return getFavorites().includes(id);
        }

        // ==================== 页面切换 ====================
        function initDisplay() {
            filterAndRender();
        }

        function switchCategory(catKey, btn) {
            currentCategory = catKey;
            renderCategoryNav(); // 重新渲染导航，更新 active 状态
            filterAndRender();
        }

        function showFavorites(btn) {
            currentCategory = 'favorites';
            renderCategoryNav();
            filterAndRender();
        }

        function filterAndRender() {
            if (currentCategory === 'favorites') {
                // 收藏：显示所有收藏的，不受日期影响
                const favs = getFavorites();
                displayedArticles = articles.filter(a => favs.includes(a.id));
            } else {
                // 分类：先按分类筛选，再按日期筛选
                let filtered = articles.filter(a => a.category === currentCategory);
                // 如果日期不是今天，或者用户手动选了日期，则按日期过滤
                // 默认显示今天的，如果今天没有则显示全部
                const today = getTodayStr();
                if (currentDate === today) {
                    // 尝试找今天的
                    const todayArticles = filtered.filter(a => a.date === today);
                    if (todayArticles.length > 0) {
                        displayedArticles = todayArticles;
                    } else {
                        // 今天没有，显示该分类最新的10条
                        displayedArticles = filtered.slice(0, 10);
                    }
                } else {
                    // 用户选了历史日期
                    displayedArticles = filtered.filter(a => a.date === currentDate);
                }
            }
            render();
        }

        function setToday() {
            currentDate = getTodayStr();
            document.getElementById('datePicker').value = currentDate;
            // 如果当前在收藏页，切回第一个分类
            if (currentCategory === 'favorites' && categories.length > 0) {
                currentCategory = categories[0].key;
                renderCategoryNav();
            }
            filterAndRender();
        }

        document.getElementById('datePicker').addEventListener('change', (e) => {
            currentDate = e.target.value;
            // 如果当前在收藏页，切回分类
            if (currentCategory === 'favorites' && categories.length > 0) {
                currentCategory = categories[0].key;
                renderCategoryNav();
            }
            filterAndRender();
        });

        // ==================== 刷新功能 ====================
        function refreshNews() {
            if (currentCategory === 'favorites') {
                showToast('收藏列表不支持换一批');
                return;
            }
            
            // 在当前分类+日期条件下，随机换一批
            let pool = articles.filter(a => a.category === currentCategory);
            if (currentDate === getTodayStr()) {
                const today = getTodayStr();
                const todayPool = pool.filter(a => a.date === today);
                if (todayPool.length > 0) pool = todayPool;
            } else {
                pool = pool.filter(a => a.date === currentDate);
            }
            
            let available = pool.filter(a => !displayedArticles.some(d => d.id === a.id));
            if (available.length < 3) {
                available = pool;
            }
            const shuffled = available.sort(() => 0.5 - Math.random());
            displayedArticles = shuffled.slice(0, 10);
            showToast('已刷新，为您推荐新资讯');
            render();
        }

        // ==================== 详情弹窗 ====================
        function openDetail(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
            
            currentModalId = id;
            
            document.getElementById('modalTag').textContent = article.categoryName || '综合';
            document.getElementById('modalTag').className = 'tag ' + (article.category || 'opensource');
            document.getElementById('modalDate').textContent = '📅 ' + formatDate(article.date);
            document.getElementById('modalTitle').textContent = article.title || '无标题';
            document.getElementById('modalSource').textContent = article.source || '未知来源';
            document.getElementById('modalCategory').textContent = article.categoryName || '综合';
            document.getElementById('modalSummary').textContent = article.summary || '暂无详细内容';
            
            updateModalFavBtn(id);
            
            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateModalFavBtn(id) {
            const btn = document.getElementById('modalFavBtn');
            if (isFav(id)) {
                btn.innerHTML = '★ 已收藏';
                btn.classList.add('fav');
            } else {
                btn.innerHTML = '☆ 收藏';
                btn.classList.remove('fav');
            }
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
            currentModalId = null;
        }

        function openSource() {
            const article = articles.find(a => a.id === currentModalId);
            if (article && article.url) {
                window.open(article.url, '_blank');
            } else {
                showToast('暂无原文链接');
            }
        }

        function copyLink() {
            const article = articles.find(a => a.id === currentModalId);
            if (article && article.url) {
                navigator.clipboard.writeText(article.url).then(() => {
                    showToast('链接已复制到剪贴板');
                }).catch(() => {
                    showToast('复制失败，请手动复制');
                });
            } else {
                showToast('暂无链接可复制');
            }
        }

        // ==================== 渲染 ====================
        function render() {
            const container = document.getElementById('content');
            let filtered = displayedArticles;
            
            if (filtered.length === 0) {
                const msg = currentCategory === 'favorites' 
                    ? '暂无收藏<br><small style="color:var(--text-secondary)">点击卡片上的☆收藏资讯</small>'
                    : '暂无资讯<br><small style="color:var(--text-secondary)">每小时自动更新中...</small>';
                container.innerHTML = `<div class="empty">${msg}</div>`;
                return;
            }
            
            container.innerHTML = filtered.map(article => `
                <div class="article-card" onclick="openDetail(${article.id})">
                    <div class="article-header">
                        <span class="tag ${article.category || 'opensource'}">${article.categoryName || '综合'}</span>
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">${formatDate(article.date)}</span>
                    </div>
                    <div class="article-title">${article.title || '无标题'}</div>
                    <div class="article-summary">${article.summary || '暂无摘要'}</div>
                    <div class="article-footer">
                        <span>来源：${article.source || '未知'}</span>
                        <button class="btn ${isFav(article.id) ? 'fav' : ''}" onclick="toggleFav(${article.id}, event)">
                            ${isFav(article.id) ? '★ 已收藏' : '☆ 收藏'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ==================== 提示条 ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ESC 关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ==================== 页面初始化 ====================
        document.getElementById('datePicker').value = getTodayStr();
        document.getElementById('todayDate').textContent = getTodayDisplay();
        loadArticles();
    </script>
</body>
</html>
