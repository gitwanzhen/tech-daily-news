<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechDaily · 技术人每日资讯</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- CSS 模块 -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/scroll.css" />
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <div class="container" id="app">
        <header class="header">
            <div class="brand">TechDaily</div>
            <div class="tagline">技术人每日必读 · 每小时自动更新</div>
            <div class="date-pill">
                <span class="dot"></span>
                <span id="todayDate">正在加载...</span>
                <span class="live-status" id="liveStatus">更新于 --:--</span>
            </div>
        </header>

        <div class="tab-control">
            <div class="tab-inner">
                <button class="tab-btn active" data-tab="ai">AI / 大模型 <span class="badge" id="badgeAI">0</span></button>
                <button class="tab-btn hot" data-tab="hot">摸鱼指南 <span class="badge" id="badgeHot">0</span></button>
            </div>
        </div>

        <div class="toolbar">
            <input type="date" id="datePicker" class="date-input-compact" />
            <span class="date-count" id="dateCount">共 0 条</span>
            <button class="icon-btn" id="todayBtn" title="今日">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
            <button class="icon-btn primary" id="updateBtn" title="刷新">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9h-4m-9 9A9 9 0 0 1 3 12m9 9v-4"/>
                </svg>
            </button>
            <div class="mode-toggle">
                <label><input type="checkbox" id="hideReadToggle" /> 隐藏已读</label>
            </div>
        </div>

        <div id="content-ai" class="compact"></div>
        <div id="content-hot" class="compact" style="display:none;"></div>

        <div id="geekCode" class="geek-code">
            <span class="geek-label">🧠 今日技术暗号：</span>
            <span id="geekText"></span>
        </div>

        <div class="footer">TechDaily · 为技术人精选每一条资讯</div>
    </div>

    <!-- 返回顶部按钮（已移除 onclick） -->
    <button class="back-to-top" id="backToTop" title="返回顶部">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"/>
        </svg>
    </button>

    <!-- 滚动滑块 -->
    <div class="scroll-slider-container" id="scrollSliderContainer">
        <div class="scroll-slider-track" id="scrollSliderTrack">
            <div class="scroll-slider-thumb" id="scrollSliderThumb"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="modal-close">&times;</button>
                <div class="modal-meta-row">
                    <span class="card-tag" id="modalTag">分类</span>
                    <span class="modal-date" id="modalDate">📅 日期</span>
                    <span class="modal-readtime" id="modalReadTime">⏱ 1 min</span>
                </div>
                <div class="modal-title" id="modalTitle">标题</div>
            </div>
            <div class="modal-body">
                <div class="modal-full-content" id="modalFullContent"></div>
                <div class="modal-content-box" id="modalContentBox" style="display:none;">
                    <h3>📄 核心摘要</h3>
                    <div class="modal-summary-full" id="modalSummary">摘要内容</div>
                </div>
                <div class="modal-actions">
                    <button class="btn" id="modalCopyBtn">📋 复制链接</button>
                    <button class="btn btn-primary" id="modalSourceBtn">↗ 阅读原文</button>
                    <button class="btn" id="modalReadToggleBtn">👁 标记已读</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
