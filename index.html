        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #1c2128;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --primary: #58a6ff;
            --primary-hover: #79b8ff;
            --tag-ai: #ff7b72;
            --tag-frontend: #7ee787;
            --tag-backend: #79c0ff;
            --tag-mobile: #d2a8ff;
            --tag-cloud: #ffa657;
            --tag-security: #f778ba;
            --tag-opensource: #a5d6ff;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0 30px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary), var(--tag-cloud));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        input[type="date"] {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        
        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            color: #fff;
        }
        
        .btn.fav {
            color: var(--tag-ai);
            border-color: rgba(255, 123, 114, 0.3);
        }
        
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }
        
        .nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .nav button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .nav button:hover {
            color: var(--text);
        }
        
        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .cat-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        
        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .article-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            background: var(--surface-hover);
        }
        
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(88, 166, 255, 0.15);
            color: var(--primary);
        }
        
        .tag.ai { background: rgba(255, 123, 114, 0.15); color: var(--tag-ai); }
        .tag.frontend { background: rgba(126, 231, 135, 0.15); color: var(--tag-frontend); }
        .tag.backend { background: rgba(121, 192, 255, 0.15); color: var(--tag-backend); }
        .tag.mobile { background: rgba(210, 168, 255, 0.15); color: var(--tag-mobile); }
        .tag.cloud { background: rgba(255, 166, 87, 0.15); color: var(--tag-cloud); }
        .tag.security { background: rgba(247, 120, 186, 0.15); color: var(--tag-security); }
        .tag.opensource { background: rgba(165, 214, 255, 0.15); color: var(--tag-opensource); }
        
        .article-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
            line-height: 1.4;
        }
        
        .article-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        
        /* 详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 28px 28px 0;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 10;
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: var(--border);
            color: var(--text);
        }
        
        .modal-body {
            padding: 20px 28px 28px;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-right: 40px;
            line-height: 1.4;
        }
        
        .modal-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .modal-summary {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 28px;
            padding: 20px;
            background: var(--bg);
            border-radius: 10px;
            border-left: 3px solid var(--primary);
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .modal-actions .btn {
            padding: 10px 20px;
            font-size: 15px;
        }
        
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 1.5rem; }
            .article-card { padding: 18px; }
            .nav button { padding: 10px 14px; font-size: 14px; }
            .modal-title { font-size: 1.2rem; }
            .modal-body { padding: 16px 20px 20px; }
            .modal-header { padding: 20px 20px 0; }
        }
    </style>
</head>

            <div class="modal-body">

                <div class="modal-actions">

                    <button class="btn" onclick="openSource()">↗ 阅读原文</button>
                    <button class="btn" onclick="closeModal()">关闭</button>

        // ==================== 状态管理 ====================
        let currentPage = 'today';
        let currentCategory = 'all';
        let currentDate = new Date().toISOString().split('T')[0];
        let displayedArticles = [];
        let currentModalId = null;

        // ==================== 初始化 ====================
        document.getElementById('datePicker').value = currentDate;
        initDisplay();

        function initDisplay() {
            // 默认显示今日资讯（按日期筛选）或随机10条
            if (currentPage === 'today') {
                const today = new Date().toISOString().split('T')[0];
                displayedArticles = articles.filter(a => a.date === today);
                if (displayedArticles.length === 0) {
                    // 如果今天没数据，显示最新的10条
                    displayedArticles = articles.slice(0, 10);
                }
            } else if (currentPage === 'history') {
                displayedArticles = articles.filter(a => a.date === currentDate);
            } else if (currentPage === 'favorites') {
                const favs = getFavorites();
                displayedArticles = articles.filter(a => favs.includes(a.id));
            }
            render();
        }

        // ==================== 收藏功能 ====================
        function getFavorites() {
            return JSON.parse(localStorage.getItem('techdaily_favs') || '[]');
        }

        function toggleFav(id, event) {
            if (event) event.stopPropagation();
            let favs = getFavorites();
            if (favs.includes(id)) {
                favs = favs.filter(f => f !== id);
                showToast('已取消收藏');
            } else {
                favs.push(id);
                showToast('已收藏');
            }
            localStorage.setItem('techdaily_favs', JSON.stringify(favs));
            render();
            // 如果弹窗打开，更新弹窗里的收藏按钮
            if (currentModalId === id) {
                updateModalFavBtn(id);
            }
        }

        function toggleFavFromModal() {
            if (currentModalId !== null) {
                toggleFav(currentModalId);
            }
        }

        function isFav(id) {
            return getFavorites().includes(id);
        }

        // ==================== 页面切换 ====================
        function showPage(page, btn) {
            currentPage = page;
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const controls = document.getElementById('controlsArea');
            const cats = document.getElementById('categoryFilters');
            
            if (page === 'favorites') {
                controls.style.display = 'none';
                cats.style.display = 'none';
            } else {
                controls.style.display = 'flex';
                cats.style.display = 'flex';
            }
            
            if (page === 'today') {
                currentDate = new Date().toISOString().split('T')[0];
                document.getElementById('datePicker').value = currentDate;
                const today = new Date().toISOString().split('T')[0];
                displayedArticles = articles.filter(a => a.date === today);
                if (displayedArticles.length === 0) displayedArticles = articles.slice(0, 10);
            } else if (page === 'history') {
                displayedArticles = articles.filter(a => a.date === currentDate);
            } else if (page === 'favorites') {
                const favs = getFavorites();
                displayedArticles = articles.filter(a => favs.includes(a.id));
            }
            
            render();
        }

        function setToday() {
            currentDate = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = currentDate;
            const todayBtn = document.querySelector('.nav button:first-child');
            showPage('today', todayBtn);
        }

        document.getElementById('datePicker').addEventListener('change', (e) => {
            currentDate = e.target.value;
            if (currentPage === 'today') {
                const historyBtn = document.querySelector('.nav button:nth-child(2)');
                showPage('history', historyBtn);
            } else {
                displayedArticles = articles.filter(a => a.date === currentDate);
                render();
            }
        });

        function filterCat(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        // ==================== 刷新功能 ====================
        function refreshNews() {
            // 从数据池中随机选取10条与当前显示不同的资讯
            const pool = currentPage === 'favorites' ? displayedArticles : articles;
            let available = pool.filter(a => !displayedArticles.some(d => d.id === a.id));
            
            if (available.length < 10) {
                available = pool; // 如果不够，从全部重新选
            }
            
            // 随机打乱取前10条
            const shuffled = available.sort(() => 0.5 - Math.random());
            displayedArticles = shuffled.slice(0, 10);
            
            showToast('已刷新，为您推荐 10 条新资讯');
            render();
        }

        // ==================== 详情弹窗 ====================
        function openDetail(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
            
            currentModalId = id;
            
            document.getElementById('modalTag').textContent = article.categoryName;
            document.getElementById('modalTag').className = 'tag ' + article.category;
            document.getElementById('modalDate').textContent = article.date;
            document.getElementById('modalSource').textContent = '来源：' + article.source;
            document.getElementById('modalTitle').textContent = article.title;
            document.getElementById('modalSummary').textContent = article.summary;
            
            updateModalFavBtn(id);
            
            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateModalFavBtn(id) {
            const btn = document.getElementById('modalFavBtn');
            if (isFav(id)) {
                btn.innerHTML = '★ 已收藏';
                btn.classList.add('fav');
            } else {
                btn.innerHTML = '☆ 收藏';
                btn.classList.remove('fav');
            }
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
            currentModalId = null;
        }

        function openSource() {
            const article = articles.find(a => a.id === currentModalId);
            if (article && article.url) {
                window.open(article.url, '_blank');
            } else {
                showToast('暂无原文链接');
            }
        }

        // ==================== 渲染 ====================
        function render() {
            const container = document.getElementById('content');
            let filtered = displayedArticles;
            
            if (currentCategory !== 'all' && currentPage !== 'favorites') {
                filtered = filtered.filter(a => a.category === currentCategory);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">暂无资讯</div>';
                return;
            }
            
            container.innerHTML = filtered.map(article => `
                <div class="article-card" onclick="openDetail(${article.id})">
                    <div class="article-header">
                        <span class="tag ${article.category}">${article.categoryName}</span>
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">${article.date}</span>
                    </div>
                    <div class="article-title">${article.title}</div>
                    <div class="article-summary">${article.summary}</div>
                    <div class="article-footer">
                        <span>来源：${article.source}</span>
                        <button class="btn ${isFav(article.id) ? 'fav' : ''}" onclick="toggleFav(${article.id}, event)">
                            ${isFav(article.id) ? '★ 已收藏' : '☆ 收藏'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ==================== 提示条 ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ESC 关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
