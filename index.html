<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechDaily · 技术人每日资讯</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-primary: #08080e;
            --bg-surface: rgba(255,255,255,0.025);
            --bg-surface-hover: rgba(255,255,255,0.045);
            --border-subtle: rgba(255,255,255,0.05);
            --border-visible: rgba(255,255,255,0.07);
            --text-primary: #e8eaed;
            --text-secondary: #b0b8c4;
            --text-tertiary: #808a99;
            --text-muted: #4d5663;
            --color-ai: #60a5fa;
            --color-ai-dim: rgba(96,165,250,0.12);
            --color-hot: #f0883e;
            --color-hot-dim: rgba(240,136,62,0.12);
            --color-brand-start: #c084fc;
            --color-brand-mid: #60a5fa;
            --color-brand-end: #34d399;
            --radius-card: 16px;
            --radius-pill: 100px;
            --radius-tab: 12px;
            --shadow-card: 0 8px 32px rgba(0,0,0,0.25);
            --transition: 0.25s cubic-bezier(0.16,1,0.3,1);
            --theme-bg-start: #08080e;
            --theme-bg-end: #0f0f1a;
        }
        body.morning { --theme-bg-start: #0a0e1a; --theme-bg-end: #141c2a; --color-brand-start: #7aa2f7; --color-brand-end: #7dcfff; }
        body.evening { --theme-bg-start: #1a0e0a; --theme-bg-end: #2a1410; --color-brand-start: #f7a27a; --color-brand-end: #ffb07c; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; background: linear-gradient(145deg, var(--theme-bg-start), var(--theme-bg-end)); }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius:10px; }
        .container { max-width:740px; margin:0 auto; padding:30px 20px 60px; position:relative; z-index:1; }
        .glow-orb { position:fixed; border-radius:50%; filter:blur(140px); pointer-events:none; z-index:0; opacity:0.06; }
        .glow-orb-1 { width:500px; height:500px; background:var(--color-brand-mid); top:-200px; left:50%; transform:translateX(-50%); }
        .glow-orb-2 { width:400px; height:400px; background:var(--color-brand-start); bottom:5%; right:-100px; }
        .glow-orb-3 { width:300px; height:300px; background:var(--color-brand-end); bottom:30%; left:-100px; opacity:0.04; }
        .header { text-align:center; margin-bottom:20px; }
        .brand { font-size:44px; font-weight:800; letter-spacing:-1.5px; background:linear-gradient(135deg, var(--color-brand-start), var(--color-brand-mid), var(--color-brand-end)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .tagline { font-size:14px; color:var(--text-tertiary); margin-bottom:12px; }
        .date-pill { display:inline-flex; align-items:center; gap:10px; background:rgba(96,165,250,0.06); border:1px solid rgba(96,165,250,0.12); color:var(--color-ai); padding:6px 18px 6px 14px; border-radius:var(--radius-pill); font-size:13px; font-weight:500; backdrop-filter:blur(10px); }
        .date-pill .dot { width:8px; height:8px; background:var(--color-brand-end); border-radius:50%; animation:pulse-dot 1.2s infinite; }
        @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.75)} }
        .stats-bar { display:flex; justify-content:center; gap:20px; margin-bottom:20px; font-size:12px; color:var(--text-muted); flex-wrap:wrap; }
        .stat-item { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.02); padding:3px 12px 3px 8px; border-radius:var(--radius-pill); border:1px solid rgba(255,255,255,0.03); }
        .stat-item .num { color:var(--text-secondary); font-weight:600; }
        .tab-control { display:flex; justify-content:center; margin-bottom:16px; }
        .tab-inner { display:flex; background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius-tab); padding:4px; gap:4px; backdrop-filter:blur(8px); }
        .tab-btn { padding:8px 20px; border-radius:10px; font-size:14px; font-weight:500; color:var(--text-tertiary); cursor:pointer; transition:all var(--transition); border:none; background:transparent; display:flex; align-items:center; gap:6px; font-family:inherit; }
        .tab-btn:hover { color:var(--text-secondary); background:rgba(255,255,255,0.03); }
        .tab-btn.active { background:var(--color-ai-dim); color:var(--color-ai); box-shadow:0 2px 12px rgba(96,165,250,0.08); }
        .tab-btn.hot.active { background:var(--color-hot-dim); color:var(--color-hot); }
        .tab-btn .badge { font-size:10px; background:rgba(255,255,255,0.06); padding:0 8px; border-radius:100px; color:var(--text-muted); }
        .toolbar { display:flex; gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap; }
        .date-input-compact { background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.05); color:var(--text-secondary); padding:0 10px; border-radius:10px; font-size:13px; height:36px; cursor:pointer; outline:none; }
        .date-count { font-size:13px; color:var(--text-muted); margin-left:4px; white-space:nowrap; }
        .icon-btn { width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.025); border:1px solid rgba(255,255,255,0.05); border-radius:10px; color:var(--text-tertiary); cursor:pointer; transition:all var(--transition); }
        .icon-btn:hover { background:rgba(255,255,255,0.05); color:var(--text-secondary); }
        .icon-btn.primary { background:var(--color-ai-dim); border-color:rgba(96,165,250,0.15); color:var(--color-ai); }
        .icon-btn.primary:hover { background:rgba(96,165,250,0.2); }
        .icon-btn.spinning svg { animation:spin 0.9s linear infinite; }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .mode-toggle { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--text-muted); }
        .mode-toggle label { cursor:pointer; display:flex; align-items:center; gap:4px; }
        .featured-card, .news-card {
            background:var(--bg-surface);
            border:1px solid var(--border-subtle);
            border-radius:var(--radius-card);
            padding:16px 18px 16px 22px;
            position:relative;
            overflow:hidden;
            cursor:pointer;
            transition:all var(--transition);
            margin-bottom:10px;
        }
        .featured-card {
            background:linear-gradient(145deg, rgba(96,165,250,0.05), rgba(192,132,252,0.025));
            border-color:rgba(96,165,250,0.1);
        }
        .featured-card::before {
            content:'';
            position:absolute;
            top:0;
            left:0;
            right:0;
            height:3px;
            background:linear-gradient(90deg, var(--color-ai), var(--color-brand-start), var(--color-brand-end));
            background-size:200% 100%;
            animation:shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer { 0%,100%{background-position:0% 0%} 50%{background-position:100% 0%} }
        .news-card::before {
            content:'';
            position:absolute;
            left:0;
            top:14px;
            bottom:14px;
            width:3px;
            border-radius:0 4px 4px 0;
            transition:all var(--transition);
        }
        .news-card.ai::before { background:linear-gradient(180deg, var(--color-ai), #3b82f6); }
        .news-card.hot::before { background:linear-gradient(180deg, var(--color-hot), #ea580c); }
        .news-card:hover, .featured-card:hover {
            background:var(--bg-surface-hover);
            border-color:var(--border-visible);
            transform:translateY(-1px);
            box-shadow:var(--shadow-card);
        }
        .card-header { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
        .card-tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2px 10px; border-radius:var(--radius-pill); flex-shrink:0; }
        .card-tag.ai { background:var(--color-ai-dim); color:var(--color-ai); }
        .card-tag.hot { background:var(--color-hot-dim); color:var(--color-hot); }
        .card-date { font-size:12px; color:var(--text-muted); flex-shrink:0; }
        .card-title {
            font-size:16px;
            font-weight:600;
            line-height:1.5;
            color:var(--text-primary);
            transition:color var(--transition);
            margin:4px 0;
            position:relative;
            padding-left:28px;
        }
        .card-title .index {
            position:absolute;
            left:0;
            top:0;
            font-weight:400;
            color:var(--text-muted);
            font-size:14px;
            opacity:0.6;
        }
        .read-title {
            color: var(--text-muted) !important;
            text-decoration: line-through;
            text-decoration-color: var(--text-muted);
            opacity:0.7;
        }
        .news-card.ai:hover .card-title { color:var(--color-ai); }
        .news-card.hot:hover .card-title { color:var(--color-hot); }
        .news-card.ai:hover .read-title { color:var(--color-ai) !important; text-decoration-color:var(--color-ai); }
        .news-card.hot:hover .read-title { color:var(--color-hot) !important; text-decoration-color:var(--color-hot); }
        .card-summary { font-size:13px; color:var(--text-tertiary); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .card-footer { display:flex; justify-content:space-between; align-items:center; margin-top:6px; flex-wrap:wrap; gap:6px; }
        .card-source { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:4px; }
        .card-source .dot { width:4px; height:4px; border-radius:50%; background:#374151; }
        .hot-score { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); }
        .hot-score .bar { width:50px; height:3px; background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden; }
        .hot-score .bar .fill { height:100%; border-radius:4px; background:linear-gradient(90deg, var(--color-hot), #ea580c); transition:width 0.6s; }
        .card-actions { display:flex; gap:6px; }
        .card-actions button { background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:2px 4px; transition:color var(--transition); }
        .card-actions button:hover { color:var(--text-secondary); }
        .read-status { width:8px; height:8px; border-radius:50%; border:1.5px solid var(--text-muted); flex-shrink:0; background:transparent; transition:all var(--transition); }
        .read-status.read { background:var(--text-muted); border-color:var(--text-muted); }
        .card-summary .core { color:var(--color-ai); font-weight:500; }
        .compact .card-summary { display:none; }
        .compact .card-footer .hot-score { display:none; }
        .compact .card-title { font-size:14px; }
        .hide-read .news-card.read-item,
        .hide-read .featured-card.read-item { display:none; }
        .digest-pool {
            position:fixed;
            bottom:20px;
            right:20px;
            background:rgba(16,16,24,0.92);
            backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:16px;
            padding:12px 16px;
            min-width:160px;
            box-shadow:0 12px 40px rgba(0,0,0,0.5);
            z-index:500;
            display:none;
        }
        .digest-pool.active { display:block; }
        .digest-pool .title { font-size:12px; color:var(--text-muted); margin-bottom:4px; }
        .digest-pool .count { font-size:18px; font-weight:700; color:var(--text-primary); }
        .digest-pool .clear-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px; float:right; }
        .modal-overlay {
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.7);
            z-index:1000;
            justify-content:center;
            align-items:center;
            padding:20px;
            backdrop-filter:blur(16px);
        }
        .modal-overlay.active { display:flex; }
        .modal-content {
            background:linear-gradient(180deg, #14141c, #0e0e16);
            border:1px solid rgba(255,255,255,0.06);
            border-radius:24px;
            max-width:680px;
            width:100%;
            max-height:90vh;
            overflow-y:auto;
            position:relative;
            animation:slide-up 0.35s cubic-bezier(0.16,1,0.3,1);
            box-shadow:0 48px 96px rgba(0,0,0,0.5);
        }
        @keyframes slide-up { from{transform:translateY(40px) scale(0.96); opacity:0} to{transform:translateY(0) scale(1); opacity:1} }
        .modal-header { padding:24px 24px 0; position:sticky; top:0; background:linear-gradient(180deg, #14141c, #14141c 70%, transparent); z-index:10; padding-bottom:12px; }
        .modal-close { position:absolute; top:14px; right:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:var(--text-tertiary); font-size:20px; cursor:pointer; width:36px; height:36px; border-radius:10px; transition:all var(--transition); }
        .modal-close:hover { background:rgba(255,255,255,0.08); color:var(--text-primary); }
        .modal-meta-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
        .modal-title { font-size:1.4rem; font-weight:700; margin-bottom:14px; padding-right:40px; line-height:1.4; }
        .modal-body { padding:0 24px 24px; }
        .modal-full-content {
            background: rgba(0,0,0,0.2);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 16px;
            border-left: 3px solid var(--color-ai);
            max-height: 420px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .modal-full-content.ai-border { border-left-color: var(--color-ai); }
        .modal-full-content.hot-border { border-left-color: var(--color-hot); }
        .modal-full-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 8px 0; }
        .modal-full-content a { color: var(--color-ai); text-decoration: underline; }
        .modal-full-content h1, .modal-full-content h2, .modal-full-content h3 { color: var(--text-primary); margin: 12px 0 6px; }
        .modal-full-content p { margin: 6px 0; }
        .modal-full-content pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; }
        .modal-full-content code { background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
        .modal-full-content ul, .modal-full-content ol { padding-left: 20px; }
        .modal-content-box {
            background:rgba(0,0,0,0.25);
            border-radius:14px;
            padding:18px 20px;
            margin-bottom:16px;
            border-left:3px solid var(--color-ai);
        }
        .modal-content-box.hot-border { border-left-color:var(--color-hot); }
        .modal-summary-full { font-size:0.95rem; line-height:1.85; color:var(--text-secondary); }
        .modal-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .modal-actions .btn { padding:8px 16px; font-size:13px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:var(--text-secondary); cursor:pointer; transition:all var(--transition); font-weight:500; }
        .modal-actions .btn:hover { background:rgba(255,255,255,0.08); }
        .modal-actions .btn-primary { background:var(--color-ai-dim); border-color:rgba(96,165,250,0.15); color:var(--color-ai); }
        .modal-actions .btn-primary:hover { background:rgba(96,165,250,0.2); }
        .toast {
            position:fixed;
            bottom:40px;
            left:50%;
            transform:translateX(-50%) translateY(100px);
            background:rgba(16,16,24,0.92);
            border:1px solid rgba(255,255,255,0.06);
            color:var(--text-primary);
            padding:10px 24px;
            border-radius:14px;
            font-size:14px;
            z-index:2000;
            opacity:0;
            transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
            pointer-events:none;
            backdrop-filter:blur(16px);
        }
        .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
        .empty { text-align:center; padding:60px 20px; color:var(--text-muted); font-size:14px; }
        .loading-more {
            text-align:center;
            padding:20px;
            color:var(--text-muted);
            font-size:13px;
        }
        .loading-more .spinner {
            display:inline-block;
            width:16px;
            height:16px;
            border:2px solid var(--text-muted);
            border-top-color:var(--color-ai);
            border-radius:50%;
            animation:spin 0.8s linear infinite;
            vertical-align:middle;
            margin-right:8px;
        }
        @media (max-width:640px) {
            .brand { font-size:32px; }
            .stats-bar { gap:10px; font-size:11px; }
            .tab-btn { padding:6px 12px; font-size:13px; }
            .container { padding:20px 12px 40px; }
            .featured-card, .news-card { padding:14px; }
            .card-title { font-size:15px; padding-left:24px; }
            .card-title .index { font-size:12px; }
            .modal-full-content { max-height: 300px; }
            .date-count { font-size:11px; }
        }
    </style>
</head>
<body>

    <!-- ===== Glow Orbs ===== -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <div class="container" id="app">
        <div class="header">
            <div class="brand">TechDaily</div>
            <div class="tagline">技术人每日必读 · 每小时自动更新</div>
            <div class="date-pill">
                <span class="dot"></span>
                <span id="todayDate">正在加载...</span>
                <span style="color:var(--text-muted);font-weight:400;font-size:11px;margin-left:4px;" id="liveStatus">更新于 --:--</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><span>📦</span><span>今日更新</span><span class="num" id="statTotal">0</span></div>
            <div class="stat-item"><span>🤖</span><span>AI 资讯</span><span class="num" id="statAI">0</span></div>
            <div class="stat-item"><span>🔥</span><span>热搜</span><span class="num" id="statHot">0</span></div>
            <div class="stat-item"><span>🕐</span><span>最后更新</span><span class="num" id="statTime">--:--</span></div>
        </div>

        <div class="tab-control">
            <div class="tab-inner">
                <button class="tab-btn active" data-tab="ai" onclick="switchTab('ai', this)">🤖 AI / 大模型 <span class="badge" id="badgeAI">0</span></button>
                <button class="tab-btn hot" data-tab="hot" onclick="switchTab('hot', this)">🔥 摸鱼指南 <span class="badge" id="badgeHot">0</span></button>
            </div>
        </div>

        <div class="toolbar">
            <input type="date" id="datePicker" class="date-input-compact" />
            <span class="date-count" id="dateCount">共 0 条</span>
            <button class="icon-btn" onclick="setToday()" title="今日">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </button>
            <button class="icon-btn primary" id="updateBtn" onclick="updateData()" title="刷新">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9h-4m-9 9A9 9 0 0 1 3 12m9 9v-4"/>
                </svg>
            </button>
            <div class="mode-toggle">
                <label><input type="checkbox" id="hideReadToggle" onchange="toggleHideRead()"> 隐藏已读</label>
            </div>
        </div>

        <div id="content-ai" class="compact"></div>
        <div id="content-hot" class="compact" style="display:none;"></div>

        <div id="geekCode" style="margin-top:20px; padding:12px 16px; background:rgba(255,255,255,0.02); border-radius:12px; border:1px solid rgba(255,255,255,0.04); font-size:13px; color:var(--text-tertiary); display:none;">
            <span style="font-weight:600; color:var(--text-secondary);">🧠 今日技术暗号：</span>
            <span id="geekText"></span>
        </div>

        <div class="footer" style="text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.03);font-size:12px;color:#374151;">
            TechDaily · 为技术人精选每一条资讯
        </div>
    </div>

    <div class="digest-pool" id="digestPool">
        <div class="title">⏰ 待消化 <button class="clear-btn" onclick="clearDigest()">清空</button></div>
        <div class="count" id="digestCount">0</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px;" id="digestHint"></div>
    </div>

    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <div class="modal-meta-row">
                    <span class="card-tag" id="modalTag" style="font-size:12px;padding:4px 12px;">分类</span>
                    <span style="color:var(--text-muted);font-size:0.85rem;" id="modalDate">📅 日期</span>
                    <span style="color:var(--text-muted);font-size:0.85rem;" id="modalReadTime">⏱ 1 min</span>
                </div>
                <div class="modal-title" id="modalTitle">标题</div>
            </div>
            <div class="modal-body">
                <div class="modal-full-content" id="modalFullContent"></div>
                <div class="modal-content-box" id="modalContentBox" style="display:none;">
                    <h3 style="font-size:0.75rem;color:var(--text-tertiary);margin-bottom:8px;text-transform:uppercase;letter-spacing:1.2px;">📄 核心摘要</h3>
                    <div class="modal-summary-full" id="modalSummary">摘要内容</div>
                </div>
                <div class="modal-actions">
                    <button class="btn" onclick="copyLink()">📋 复制链接</button>
                    <button class="btn btn-primary" onclick="openSource()">↗ 阅读原文</button>
                    <button class="btn" onclick="toggleReadStatus()">👁 标记已读</button>
                    <button class="btn" onclick="addToDigest()">⏰ 稍后读</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ========================================================================
        //  CONFIG & STATE
        // ========================================================================
        const STORAGE_KEY_READ = 'techdaily_read_ids';
        const STORAGE_KEY_DIGEST = 'techdaily_digest_ids';
        const PAGE_SIZE = 20;
        const DATA_DIR = 'data/';

        let articles = [];
        let aiAll = [], hotAll = [];
        let aiPage = 0, hotPage = 0;
        let currentTab = 'ai';
        let currentDate = getTodayStr();
        let readIds = new Set();
        let digestIds = new Set();
        let currentArticle = null;
        let isRefreshing = false;
        let isLoadingMore = false;
        let hasMoreAI = true, hasMoreHot = true;

        const GEEK_CODES = [
            "Llama 4 的 200 万 token 上下文相当于让 AI 一次性读完《三体》三部曲还多出 40% 容量",
            "GPT-5 的代码生成准确率 92% 已超过人类初级工程师的平均水平 (约 85%)",
            "Stable Diffusion 3.5 手部生成失败率从 37% 降至 6%，终于能画好手指了",
            "Claude 4 的思维链可视化让开发者发现模型在推理时会 '自我纠错' 平均 2.3 次",
            "DeepSeek V3 的 MoE 架构使得推理成本仅为 GPT-4 的 1/7",
        ];

        // ========================================================================
        //  UTILITY
        // ========================================================================
        function getBeijingDate() {
            const now = new Date();
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            return new Date(utc + 3600000 * 8);
        }
        function getTodayStr() {
            const d = getBeijingDate();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function getTodayDisplay() {
            const d = getBeijingDate();
            const weekdays = ['日','一','二','三','四','五','六'];
            return `今天 ${d.getMonth()+1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
        }
        function formatDate(dateStr) {
            if (!dateStr) return '日期未知';
            const today = getTodayStr();
            const y = getBeijingDate();
            const yest = new Date(y.getTime()-86400000);
            const yestStr = yest.getFullYear()+'-'+String(yest.getMonth()+1).padStart(2,'0')+'-'+String(yest.getDate()).padStart(2,'0');
            if (dateStr === today) return '今天';
            if (dateStr === yestStr) return '昨天';
            return dateStr;
        }
        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }
        function estimateReadTime(text) {
            if (!text) return 1;
            const words = text.replace(/\s/g,'').length;
            return Math.max(1, Math.round(words/120));
        }

        function generateStableId(article) {
            const key = (article.title || '') + (article.source || '');
            let hash = 0;
            for (let i = 0; i < key.length; i++) {
                hash = (hash << 5) - hash + key.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        // ========================================================================
        //  STORAGE
        // ========================================================================
        function loadReadIds() {
            try { const raw=localStorage.getItem(STORAGE_KEY_READ); if(raw) readIds=new Set(JSON.parse(raw)); } catch(_){ readIds=new Set(); }
        }
        function saveReadIds() { try { localStorage.setItem(STORAGE_KEY_READ, JSON.stringify([...readIds])); } catch(_){} }
        function loadDigestIds() {
            try { const raw=localStorage.getItem(STORAGE_KEY_DIGEST); if(raw) digestIds=new Set(JSON.parse(raw)); } catch(_){ digestIds=new Set(); }
        }
        function saveDigestIds() { try { localStorage.setItem(STORAGE_KEY_DIGEST, JSON.stringify([...digestIds])); } catch(_){} }

        function markAsRead(id) { readIds.add(id); saveReadIds(); updateReadStatusUI(); updateDigestUI(); }
        function toggleReadStatus() { if(currentArticle) { const id=currentArticle.id; if(readIds.has(id)) readIds.delete(id); else readIds.add(id); saveReadIds(); updateReadStatusUI(); renderAll(); showToast(readIds.has(id)?'已标记已读':'取消已读'); } }
        function addToDigest() { if(currentArticle) { const id=currentArticle.id; if(digestIds.has(id)) digestIds.delete(id); else digestIds.add(id); saveDigestIds(); updateDigestUI(); showToast(digestIds.has(id)?'已加入待消化池':'已移除'); } }

        // ========================================================================
        //  DATA LOADING
        // ========================================================================
        async function loadArticlesByDate(dateStr) {
            try {
                const resp = await fetch(`${DATA_DIR}${dateStr}.json`);
                if (!resp.ok) {
                    if (resp.status===404) return [];
                    throw new Error('HTTP '+resp.status);
                }
                return await resp.json();
            } catch(e) { console.error(e); return []; }
        }
        async function loadIndex() {
            try {
                const resp = await fetch(`${DATA_DIR}index.json`);
                if (!resp.ok) return {};
                return await resp.json();
            } catch(_){ return {}; }
        }

        // ========================================================================
        //  RENDER
        // ========================================================================
        function renderCard(article, featured=false, index=null) {
            if (!article.id) article.id = generateStableId(article);

            const isRead = readIds.has(article.id);
            const hot = article.hot_score || 30;
            const readTime = article.read_time || estimateReadTime(article.summary || article.title);
            const summary = article.summary && article.summary.trim() ? article.summary : (article.title ? article.title.slice(0,60)+'…' : '点击查看详情');
            const catClass = article.category === 'hot' ? 'hot' : 'ai';
            const catName = article.categoryName || (article.category==='hot' ? '🔥 热搜' : '🤖 AI');

            const indexHtml = (index !== null) ? `<span class="index">${index+1}.</span>` : '';
            const readTitleClass = isRead ? 'read-title' : '';
            const articleData = encodeURIComponent(JSON.stringify(article));

            let html = `<div class="${featured?'featured-card':'news-card'} ${catClass} read-item" data-article="${articleData}" data-id="${article.id}">`;
            if (!featured) {
                html += `<div class="card-header">
                            <span class="card-tag ${catClass}">${catName}</span>
                            <span style="display:flex;align-items:center;gap:6px;">
                                <span style="font-size:11px;color:var(--text-muted);">${readTime} min</span>
                                <span class="card-date">${formatDate(article.date)}</span>
                                <span class="read-status ${isRead?'read':''}"></span>
                            </span>
                        </div>`;
            } else {
                html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                            <span class="card-tag ${catClass}" style="background:var(--color-ai-dim);color:var(--color-ai);">🌟 精选</span>
                            <span style="display:flex;align-items:center;gap:6px;">
                                <span style="font-size:11px;color:var(--text-muted);">${readTime} min</span>
                                <span class="card-date">${formatDate(article.date)}</span>
                                <span class="read-status ${isRead?'read':''}"></span>
                            </span>
                        </div>`;
            }
            html += `<div class="card-title ${readTitleClass}">${indexHtml}${escapeHtml(article.title)}</div>`;
            html += `<div class="card-summary"><span class="core">💡 核心：</span>${escapeHtml(summary)}</div>`;
            html += `<div class="card-footer">
                        <span class="card-source"><span class="dot"></span>${escapeHtml(article.source||'未知')}</span>
                        <span class="hot-score">
                            <span>🔥 ${hot}</span>
                            <span class="bar"><span class="fill" style="width:${Math.min(100, 30+hot*0.7)}%;"></span></span>
                        </span>
                        <span class="card-actions">
                            <button onclick="event.stopPropagation();addToDigestById(${article.id})" title="稍后读">⏰</button>
                        </span>
                    </div>`;
            html += `</div>`;
            return html;
        }

        function renderAll() {
            const containerAI = document.getElementById('content-ai');
            const containerHot = document.getElementById('content-hot');

            // 根据页码计算要显示的数据量
            const aiLimit = Math.min((aiPage + 1) * PAGE_SIZE, aiAll.length);
            const hotLimit = Math.min((hotPage + 1) * PAGE_SIZE, hotAll.length);

            const aiPageData = aiAll.slice(0, aiLimit);
            const hotPageData = hotAll.slice(0, hotLimit);

            // 检查是否还有更多
            hasMoreAI = aiLimit < aiAll.length;
            hasMoreHot = hotLimit < hotAll.length;

            // AI 列表
            if (aiPageData.length===0) {
                containerAI.innerHTML = '<div class="empty">暂无 AI 资讯</div>';
            } else {
                let html = '';
                for (let i=0; i<aiPageData.length; i++) {
                    const featured = (i===0);
                    html += renderCard(aiPageData[i], featured, i);
                }
                if (hasMoreAI) {
                    html += `<div class="loading-more" id="aiLoadingMore"><span class="spinner"></span>加载更多...</div>`;
                } else {
                    html += `<div class="loading-more" style="opacity:0.5;">— 已加载全部 —</div>`;
                }
                containerAI.innerHTML = html;
            }

            // HOT 列表
            if (hotPageData.length===0) {
                containerHot.innerHTML = '<div class="empty">暂无热搜</div>';
            } else {
                let html = '';
                for (let i=0; i<hotPageData.length; i++) {
                    html += renderCard(hotPageData[i], i===0, i);
                }
                if (hasMoreHot) {
                    html += `<div class="loading-more" id="hotLoadingMore"><span class="spinner"></span>加载更多...</div>`;
                } else {
                    html += `<div class="loading-more" style="opacity:0.5;">— 已加载全部 —</div>`;
                }
                containerHot.innerHTML = html;
            }

            // 更新徽章、统计、日期条数
            document.getElementById('badgeAI').textContent = aiAll.length;
            document.getElementById('badgeHot').textContent = hotAll.length;
            document.getElementById('statTotal').textContent = articles.length;
            document.getElementById('statAI').textContent = aiAll.length;
            document.getElementById('statHot').textContent = hotAll.length;
            const now = getBeijingDate();
            document.getElementById('statTime').textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
            document.getElementById('dateCount').textContent = `共 ${articles.length} 条`;

            updateReadStatusUI();
            updateDigestUI();
            updateGeekCode();

            // 重置加载状态
            isLoadingMore = false;

            // 立即检查是否需要加载更多（当内容不足一屏时）
            setTimeout(() => {
                checkAndLoadMore();
            }, 100);
        }

        // ========================================================================
        //  LOAD MORE (核心修复)
        // ========================================================================
        function checkAndLoadMore() {
            if (isLoadingMore) return;

            const container = currentTab === 'ai' ? document.getElementById('content-ai') : document.getElementById('content-hot');
            if (!container) return;

            // 检查是否有更多数据
            const hasMore = currentTab === 'ai' ? hasMoreAI : hasMoreHot;
            if (!hasMore) return;

            // 获取容器底部位置
            const rect = container.getBoundingClientRect();
            const containerBottom = rect.bottom;
            const viewportHeight = window.innerHeight;

            // 当容器底部在视口内或上方时触发加载（即容器内容已全部可见）
            // 或者当距离底部小于 300px 时触发
            if (containerBottom <= viewportHeight + 300) {
                isLoadingMore = true;
                if (currentTab === 'ai' && hasMoreAI) {
                    aiPage++;
                    renderAll();
                } else if (currentTab === 'hot' && hasMoreHot) {
                    hotPage++;
                    renderAll();
                } else {
                    isLoadingMore = false;
                }
            }
        }

        // ========================================================================
        //  GEEK CODE
        // ========================================================================
        function updateGeekCode() {
            const el = document.getElementById('geekCode');
            const textEl = document.getElementById('geekText');
            const idx = Math.floor(Math.random() * GEEK_CODES.length);
            textEl.textContent = GEEK_CODES[idx];
            el.style.display = 'block';
        }

        // ========================================================================
        //  DIGEST UI
        // ========================================================================
        function updateDigestUI() {
            const pool = document.getElementById('digestPool');
            const count = digestIds.size;
            document.getElementById('digestCount').textContent = count;
            if (count > 0) {
                pool.classList.add('active');
                document.getElementById('digestHint').textContent = `共 ${count} 篇待读`;
                const unreadCount = articles.filter(a => !readIds.has(a.id)).length;
                if (unreadCount > 10 && count > 0) {
                    document.getElementById('digestHint').textContent = `⚠️ 您有 ${count} 篇待读，建议现在消灭！`;
                }
            } else {
                pool.classList.remove('active');
            }
        }

        function addToDigestById(id) {
            if (digestIds.has(id)) digestIds.delete(id); else digestIds.add(id);
            saveDigestIds();
            updateDigestUI();
            showToast(digestIds.has(id)?'已加入待消化池':'已移除');
        }

        function clearDigest() {
            digestIds.clear();
            saveDigestIds();
            updateDigestUI();
            showToast('已清空待消化池');
        }

        // ========================================================================
        //  READ STATUS UI
        // ========================================================================
        function updateReadStatusUI() {
            document.querySelectorAll('.news-card, .featured-card').forEach(el => {
                const id = parseInt(el.dataset.id);
                if (!id) return;
                const isRead = readIds.has(id);
                const dot = el.querySelector('.read-status');
                if (dot) dot.classList.toggle('read', isRead);
                el.classList.toggle('read-item', isRead);
                const title = el.querySelector('.card-title');
                if (title) title.classList.toggle('read-title', isRead);
            });
        }

        // ========================================================================
        //  TOGGLE
        // ========================================================================
        function toggleHideRead() {
            const checked = document.getElementById('hideReadToggle').checked;
            document.getElementById('content-ai').classList.toggle('hide-read', checked);
            document.getElementById('content-hot').classList.toggle('hide-read', checked);
        }

        // ========================================================================
        //  TAB
        // ========================================================================
        function switchTab(tab, btn) {
            currentTab = tab;
            aiPage = 0;
            hotPage = 0;
            hasMoreAI = true;
            hasMoreHot = true;
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('content-ai').style.display = tab==='ai' ? 'block' : 'none';
            document.getElementById('content-hot').style.display = tab==='hot' ? 'block' : 'none';
            renderAll();
        }

        // ========================================================================
        //  DATE PICKER
        // ========================================================================
        async function setToday() {
            currentDate = getTodayStr();
            document.getElementById('datePicker').value = currentDate;
            await loadAndRender(currentDate);
            showToast('已回到今日');
        }

        document.getElementById('datePicker').addEventListener('change', async (e) => {
            const date = e.target.value;
            if (date) {
                currentDate = date;
                await loadAndRender(date);
            }
        });

        // ========================================================================
        //  LOAD & RENDER BY DATE
        // ========================================================================
        async function loadAndRender(dateStr) {
            let data = await loadArticlesByDate(dateStr);
            data = data.map(article => {
                if (!article.id) article.id = generateStableId(article);
                return article;
            });
            articles = data;
            aiAll = articles.filter(a => a.category === 'ai').sort((a,b) => b.id - a.id);
            hotAll = articles.filter(a => a.category === 'hot').sort((a,b) => b.id - a.id);
            aiPage = 0;
            hotPage = 0;
            hasMoreAI = true;
            hasMoreHot = true;
            renderAll();
            document.getElementById('todayDate').textContent = dateStr === getTodayStr() ? getTodayDisplay() : formatDate(dateStr);
            document.getElementById('datePicker').value = dateStr;
            const hour = getBeijingDate().getHours();
            document.body.className = (hour >= 6 && hour < 18) ? 'morning' : 'evening';
        }

        // ========================================================================
        //  MODAL
        // ========================================================================
        function openDetailFromCard(cardElement) {
            const encoded = cardElement.dataset.article;
            if (!encoded) {
                showToast('无法读取文章数据');
                return;
            }
            try {
                const article = JSON.parse(decodeURIComponent(encoded));
                showModal(article);
            } catch(e) {
                showToast('数据解析失败');
                console.error(e);
            }
        }

        function showModal(article) {
            currentArticle = article;
            const tag = document.getElementById('modalTag');
            tag.textContent = article.categoryName || (article.category==='hot'?'🔥 热搜':'🤖 AI');
            tag.className = 'card-tag ' + (article.category||'ai');
            tag.style.cssText = article.category==='hot' ? 'background:var(--color-hot-dim);color:var(--color-hot);' : 'background:var(--color-ai-dim);color:var(--color-ai);';
            document.getElementById('modalDate').textContent = '📅 ' + formatDate(article.date);
            document.getElementById('modalReadTime').textContent = '⏱ ' + (article.read_time||estimateReadTime(article.summary)) + ' min';
            document.getElementById('modalTitle').textContent = article.title;

            const fullContainer = document.getElementById('modalFullContent');
            const summaryContainer = document.getElementById('modalContentBox');
            const summaryText = document.getElementById('modalSummary');

            let hasValidContent = false;
            let contentHtml = article.full_content || '';
            const stripped = contentHtml.replace(/<[^>]+>/g, '').trim();
            if (stripped.length > 0) {
                hasValidContent = true;
            }

            if (hasValidContent) {
                fullContainer.innerHTML = contentHtml;
                fullContainer.style.display = 'block';
                summaryContainer.style.display = 'none';
                if (article.category === 'hot') {
                    fullContainer.classList.add('hot-border');
                } else {
                    fullContainer.classList.add('ai-border');
                }
            } else {
                fullContainer.style.display = 'block';
                summaryContainer.style.display = 'none';
                const hot = article.hot_score || 30;
                const source = article.source || '未知来源';
                const date = formatDate(article.date);
                const url = article.url || '#';
                const summary = article.summary && article.summary.trim() ? `<p><strong>摘要：</strong>${escapeHtml(article.summary)}</p>` : '';

                fullContainer.innerHTML = `
                    <div style="padding: 8px 0;">
                        <p style="font-size:1.1rem; font-weight:600; color:var(--text-primary); margin-bottom:8px;">📌 热搜详情</p>
                        <p><strong>标题：</strong>${escapeHtml(article.title)}</p>
                        <p><strong>来源：</strong>${escapeHtml(source)}</p>
                        <p><strong>热度：</strong>🔥 ${hot}</p>
                        <p><strong>日期：</strong>${date}</p>
                        ${summary}
                        ${url && url !== '#' ? `<p><strong>链接：</strong><a href="${url}" target="_blank">查看原文</a></p>` : ''}
                        <p style="margin-top:12px; color:var(--text-muted); font-size:0.9rem; border-top:1px solid var(--border-subtle); padding-top:12px;">
                            ⚠️ 当前数据源未提供完整文章内容，以上为摘要信息。
                        </p>
                    </div>
                `;
                if (article.category === 'hot') {
                    fullContainer.classList.add('hot-border');
                } else {
                    fullContainer.classList.add('ai-border');
                }
            }

            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            if (article.id) markAsRead(article.id);
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
            currentArticle = null;
            updateReadStatusUI();
        }

        function openSource() {
            if (currentArticle?.url && currentArticle.url !== '#') window.open(currentArticle.url,'_blank');
            else showToast('无原文链接');
        }
        function copyLink() {
            if (currentArticle?.url && currentArticle.url !== '#') {
                navigator.clipboard.writeText(currentArticle.url).then(()=>showToast('链接已复制')).catch(()=>showToast('复制失败'));
            } else showToast('无链接');
        }

        // ========================================================================
        //  UPDATE DATA
        // ========================================================================
        async function updateData() {
            if (isRefreshing) return;
            isRefreshing = true;
            const btn = document.getElementById('updateBtn');
            btn.classList.add('spinning');
            btn.disabled = true;
            try {
                showToast('正在触发爬虫更新...');
                await new Promise(r => setTimeout(r, 2000));
                await loadAndRender(currentDate);
                showToast('数据已刷新 (实际需触发Action)');
            } catch(e) { showToast('刷新失败'); } finally { btn.classList.remove('spinning'); btn.disabled=false; isRefreshing=false; }
        }

        // ========================================================================
        //  TOAST
        // ========================================================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
        }

        // ========================================================================
        //  INIT
        // ========================================================================
        async function init() {
            loadReadIds();
            loadDigestIds();
            const today = getTodayStr();
            const index = await loadIndex();
            let targetDate = today;
            if (!index[today]) {
                const dates = Object.keys(index).sort();
                if (dates.length>0) targetDate = dates[dates.length-1];
            }
            currentDate = targetDate;
            await loadAndRender(targetDate);

            // 卡片点击事件委托
            document.addEventListener('click', function(e) {
                const card = e.target.closest('.news-card, .featured-card');
                if (card && !e.target.closest('.card-actions')) {
                    openDetailFromCard(card);
                }
            });

            // UI 控件
            document.getElementById('hideReadToggle').addEventListener('change', toggleHideRead);
            document.getElementById('updateBtn').addEventListener('click', updateData);
            document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
            document.getElementById('detailModal').addEventListener('click', (e) => { if(e.target===e.currentTarget) closeModal(); });
            document.getElementById('modalSourceBtn').addEventListener('click', openSource);
            document.getElementById('modalCopyBtn').addEventListener('click', copyLink);
            document.getElementById('modalReadToggleBtn').addEventListener('click', toggleReadStatus);
            document.getElementById('modalDigestBtn').addEventListener('click', addToDigest);
            document.getElementById('clearDigestBtn').addEventListener('click', clearDigest);

            // 滚动加载（核心修复）
            let scrollTimer = null;
            window.addEventListener('scroll', () => {
                if (scrollTimer) return;
                scrollTimer = setTimeout(() => {
                    checkAndLoadMore();
                    scrollTimer = null;
                }, 100);
            });

            // 窗口大小变化时也检查
            window.addEventListener('resize', () => {
                setTimeout(checkAndLoadMore, 200);
            });

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName==='INPUT') return;
                if (e.key==='Escape') closeModal();
                if (e.key==='r' || e.key==='R') updateData();
                if (e.key==='h' || e.key==='H') { const cb=document.getElementById('hideReadToggle'); cb.checked=!cb.checked; toggleHideRead(); }
            });

            // 实时状态
            setInterval(() => {
                const now = getBeijingDate();
                document.getElementById('liveStatus').textContent = '更新于 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
            }, 10000);
        }

        init();
    </script>
</body>
</html>
