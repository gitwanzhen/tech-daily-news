<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechDaily AI - AI每日资讯</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-hover: #1c2128;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --primary: #58a6ff;
            --primary-hover: #79b8ff;
            --tag-ai: #ff7b72;
            --tag-hot: #feca57;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary), var(--tag-ai));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        
        .today-date {
            display: inline-block;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 8px;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        input[type="date"] {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        
        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            color: #fff;
        }
        
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
        }
        
        .nav button {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .nav button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .nav button:hover {
            color: var(--text);
        }
        
        .article-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .article-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            background: var(--surface-hover);
        }
        
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(88, 166, 255, 0.15);
            color: var(--primary);
        }
        
        .tag.ai { background: rgba(255, 123, 114, 0.15); color: var(--tag-ai); }
        .tag.hot { background: rgba(254, 202, 87, 0.15); color: var(--tag-hot); }
        
        .article-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
            line-height: 1.4;
        }
        
        .article-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-header {
            padding: 28px 28px 0;
            position: sticky;
            top: 0;
            background: var(--surface);
            z-index: 10;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: var(--border);
            color: var(--text);
        }
        
        .modal-body {
            padding: 24px 28px 28px;
        }
        
        .modal-meta-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-right: 40px;
            line-height: 1.4;
            color: var(--text);
        }
        
        .modal-content-box {
            background: var(--bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border-left: 4px solid var(--primary);
        }
        
        .modal-content-box h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .modal-summary-full {
            font-size: 1.05rem;
            line-height: 1.9;
            color: var(--text);
        }
        
        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .modal-info-item {
            background: var(--bg);
            padding: 14px 18px;
            border-radius: 10px;
        }
        
        .modal-info-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .modal-info-value {
            font-size: 0.95rem;
            color: var(--text);
            font-weight: 500;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .modal-actions .btn {
            padding: 10px 20px;
            font-size: 15px;
        }
        
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 1.5rem; }
            .article-card { padding: 18px; }
            .nav button { padding: 10px 14px; font-size: 14px; }
            .modal-title { font-size: 1.2rem; }
            .modal-body { padding: 16px 20px 20px; }
            .modal-header { padding: 20px 20px 0; }
            .modal-info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TechDaily AI</h1>
            <p class="subtitle">AI / 大模型 / 人工智能 每日资讯</p>
            <div class="today-date" id="todayDate">加载中...</div>
        </header>
        
        <div class="controls" id="controlsArea">
            <input type="date" id="datePicker">
            <button class="btn" onclick="setToday()">回到今日</button>
            <button class="btn btn-primary" onclick="refreshNews()">🔄 换一批</button>
        </div>
        
        <nav class="nav">
            <button class="active" onclick="showPage('ai', this)">AI/大模型</button>
            <button onclick="showPage('hot', this)">☕ 轻松一下</button>
        </nav>
        
        <div id="content"></div>
    </div>

    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <div class="modal-meta-row">
                    <span class="tag" id="modalTag">分类</span>
                    <span style="color: var(--text-secondary); font-size: 0.9rem;" id="modalDate">📅 日期</span>
                </div>
                <div class="modal-title" id="modalTitle">标题</div>
            </div>
            <div class="modal-body">
                <div class="modal-info-grid">
                    <div class="modal-info-item">
                        <div class="modal-info-label">来源</div>
                        <div class="modal-info-value" id="modalSource">--</div>
                    </div>
                    <div class="modal-info-item">
                        <div class="modal-info-label">分类</div>
                        <div class="modal-info-value" id="modalCategory">--</div>
                    </div>
                </div>
                
                <div class="modal-content-box">
                    <h3>📄 内容摘要</h3>
                    <div class="modal-summary-full" id="modalSummary">摘要内容</div>
                </div>
                
                <div class="modal-actions">
                    <button class="btn" onclick="copyLink()">📋 复制链接</button>
                    <button class="btn" onclick="openSource()">↗ 阅读原文</button>
                    <button class="btn" onclick="closeModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== 工具函数：获取北京时间 ====================
        function getBeijingDate() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 8));
        }
        
        function getTodayStr() {
            const d = getBeijingDate();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        function getTodayDisplay() {
            const d = getBeijingDate();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const month = d.getMonth() + 1;
            const day = d.getDate();
            const week = weekdays[d.getDay()];
            return `今天 ${month}月${day}日 星期${week}`;
        }

        // ==================== 数据加载 ====================
        let articles = [];
        let currentPage = 'ai';          // 'ai' 或 'hot'
        let currentDate = getTodayStr();
        let displayedArticles = [];
        let currentModalId = null;

        async function loadArticles() {
            try {
                const response = await fetch('data/news.json?t=' + Date.now());
                const data = await response.json();
                articles = data;
                initDisplay();
            } catch (err) {
                console.error('加载数据失败:', err);
                document.getElementById('content').innerHTML = 
                    '<div class="empty">数据加载失败，请稍后刷新重试<br><small style="color:var(--text-secondary)">每小时自动更新中...</small></div>';
            }
        }

        // ==================== 日期格式化 ====================
        function formatDate(dateStr) {
            if (!dateStr || dateStr === 'undefined' || dateStr === 'null') return '日期未知';
            const today = getTodayStr();
            const yesterday = new Date(getBeijingDate().getTime() - 86400000);
            const yestStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
            
            if (dateStr === today) return '今天';
            if (dateStr === yestStr) return '昨天';
            return dateStr;
        }

        // ==================== 页面切换 ====================
        function initDisplay() {
            filterAndRender();
        }

        function showPage(page, btn) {
            currentPage = page;
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const controls = document.getElementById('controlsArea');
            if (page === 'hot') {
                controls.style.display = 'none';
            } else {
                controls.style.display = 'flex';
            }
            
            filterAndRender();
        }

        function filterAndRender() {
            if (currentPage === 'hot') {
                // 热搜：只显示 category 为 hot 的内容，按日期倒序
                displayedArticles = articles
                    .filter(a => a.category === 'hot')
                    .sort((a, b) => b.date.localeCompare(a.date))
                    .slice(0, 30);
            } else {
                // AI/大模型：只显示 AI 分类，受日期控制
                let filtered = articles.filter(a => a.category === 'ai');
                const today = getTodayStr();
                
                if (currentDate === today) {
                    const todayArticles = filtered.filter(a => a.date === today);
                    if (todayArticles.length > 0) {
                        displayedArticles = todayArticles;
                    } else {
                        displayedArticles = filtered.slice(0, 10);
                    }
                } else {
                    displayedArticles = filtered.filter(a => a.date === currentDate);
                }
            }
            render();
        }

        function setToday() {
            currentDate = getTodayStr();
            document.getElementById('datePicker').value = currentDate;
            if (currentPage === 'hot') {
                const aiBtn = document.querySelector('.nav button:first-child');
                showPage('ai', aiBtn);
            } else {
                filterAndRender();
            }
        }

        document.getElementById('datePicker').addEventListener('change', (e) => {
            currentDate = e.target.value;
            if (currentPage === 'hot') {
                const aiBtn = document.querySelector('.nav button:first-child');
                showPage('ai', aiBtn);
            } else {
                filterAndRender();
            }
        });

        // ==================== 刷新功能 ====================
        function refreshNews() {
            if (currentPage === 'hot') {
                // 热搜：从所有热搜中随机换一批
                let pool = articles.filter(a => a.category === 'hot');
                let available = pool.filter(a => !displayedArticles.some(d => d.id === a.id));
                if (available.length < 3) available = pool;
                
                const shuffled = available.sort(() => 0.5 - Math.random());
                displayedArticles = shuffled.slice(0, 10);
                showToast('已刷新轻松一下');
            } else {
                // AI：现有逻辑
                let pool = articles.filter(a => a.category === 'ai');
                const today = getTodayStr();
                
                if (currentDate === today) {
                    const todayPool = pool.filter(a => a.date === today);
                    if (todayPool.length > 0) pool = todayPool;
                } else {
                    pool = pool.filter(a => a.date === currentDate);
                }
                
                let available = pool.filter(a => !displayedArticles.some(d => d.id === a.id));
                if (available.length < 3) available = pool;
                
                const shuffled = available.sort(() => 0.5 - Math.random());
                displayedArticles = shuffled.slice(0, 10);
                showToast('已刷新，为您推荐新资讯');
            }
            render();
        }

        // ==================== 详情弹窗 ====================
        function openDetail(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
            
            currentModalId = id;
            
            document.getElementById('modalTag').textContent = article.categoryName || '综合';
            document.getElementById('modalTag').className = 'tag ' + (article.category || 'ai');
            document.getElementById('modalDate').textContent = '📅 ' + formatDate(article.date);
            document.getElementById('modalTitle').textContent = article.title || '无标题';
            document.getElementById('modalSource').textContent = article.source || '未知来源';
            document.getElementById('modalCategory').textContent = article.categoryName || '综合';
            document.getElementById('modalSummary').textContent = article.summary || '暂无详细内容';
            
            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
            currentModalId = null;
        }

        function openSource() {
            const article = articles.find(a => a.id === currentModalId);
            if (article && article.url) {
                window.open(article.url, '_blank');
            } else {
                showToast('暂无原文链接');
            }
        }

        function copyLink() {
            const article = articles.find(a => a.id === currentModalId);
            if (article && article.url) {
                navigator.clipboard.writeText(article.url).then(() => {
                    showToast('链接已复制到剪贴板');
                }).catch(() => {
                    showToast('复制失败，请手动复制');
                });
            } else {
                showToast('暂无链接可复制');
            }
        }

        // ==================== 渲染 ====================
        function render() {
            const container = document.getElementById('content');
            
            if (displayedArticles.length === 0) {
                const msg = currentPage === 'hot' 
                    ? '暂无热搜数据<br><small style="color:var(--text-secondary)">每小时自动更新中...</small>'
                    : '暂无 AI 资讯<br><small style="color:var(--text-secondary)">每小时自动更新中...</small>';
                container.innerHTML = `<div class="empty">${msg}</div>`;
                return;
            }
            
            container.innerHTML = displayedArticles.map(article => `
                <div class="article-card" onclick="openDetail(${article.id})">
                    <div class="article-header">
                        <span class="tag ${article.category || 'ai'}">${article.categoryName || '综合'}</span>
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">${formatDate(article.date)}</span>
                    </div>
                    <div class="article-title">${article.title || '无标题'}</div>
                    <div class="article-summary">${article.summary || '暂无摘要'}</div>
                    <div class="article-footer">
                        <span>来源：${article.source || '未知'}</span>
                    </div>
                </div>
            `).join('');
        }

        // ==================== 提示条 ====================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2002);
        }

        // ESC 关闭弹窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ==================== 页面初始化 ====================
        document.getElementById('datePicker').value = getTodayStr();
        document.getElementById('todayDate').textContent = getTodayDisplay();
        loadArticles();
    </script>
</body>
</html>
