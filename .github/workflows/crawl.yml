name: Daily News Crawler

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 lxml -i https://pypi.tuna.tsinghua.edu.cn/simple
      
      - name: Run crawler
        run: python scripts/crawler.py
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update news $(date +%Y-%m-%d-%H:%M)"
          git push origin HEAD:${{ github.ref_name }}
