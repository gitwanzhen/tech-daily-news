name: Daily News Crawler

on:
  schedule:
    # 每小时执行一次（UTC 整点，对应北京时间 1/2/3...点）
    - cron: '0 * * * *'
  # 保留手动点击运行
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install feedparser requests -i https://pypi.tuna.tsinghua.edu.cn/simple
      
      - name: Run crawler
        run: python scripts/crawler.py
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # 添加 data 目录下所有变更（包括日期文件、索引文件等）
          git add data/
          git diff --cached --quiet || git commit -m "Update news $(date +%Y-%m-%d-%H:%M)"
          git push origin HEAD:${{ github.ref_name }}
